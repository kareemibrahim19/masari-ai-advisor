<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساري - المرشد الأكاديمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa; --panel: #ffffff; --text: #1d2433; --muted: #6b7385;
    --accent: #2b59c3; --accent-soft: #e8eefb; --user: #2b59c3; --user-text: #fff;
    --border: #e1e4ec; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b; --panel: #1a1f2a; --text: #e6e9f0; --muted: #9aa3b5;
      --accent: #6d95ff; --accent-soft: #232c40; --user: #3a63d0; --user-text: #fff;
      --border: #2a3142; --err: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; height: 100dvh;
         display: flex; flex-direction: column; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; align-items: center; gap: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff;
          display: grid; place-items: center; font-weight: 700; font-size: 20px; flex-shrink: 0; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  header .grow { flex: 1; }
  .ghost { border: 1px solid var(--border); background: transparent; color: var(--muted);
           border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .ghost:hover { color: var(--text); border-color: var(--accent); }
  #chat { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px 16px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 16px; border-radius: 14px; line-height: 1.8; max-width: 88%; overflow-wrap: anywhere; }
  .user { align-self: flex-start; background: var(--user); color: var(--user-text); white-space: pre-wrap; }
  .bot { align-self: flex-end; background: var(--panel); border: 1px solid var(--border); }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0; padding-inline-start: 22px; }
  .error { color: var(--err); }
  details { margin-top: 10px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
  .typing { color: var(--muted); font-size: 14px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .suggest button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
                    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .suggest button:hover { border-color: var(--accent); }
  .welcome { text-align: center; color: var(--muted); margin-top: 8vh; }
  .welcome h2 { color: var(--text); margin-bottom: 6px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
          padding: 22px; width: 100%; max-width: 520px; margin: 6vh auto 0; line-height: 1.8;
          overflow-wrap: anywhere; }
  .card h2 { margin: 0 0 6px; font-size: 19px; }
  .card ol { padding-inline-start: 22px; margin: 8px 0 14px; }
  .card a { color: var(--accent); }
  .card .row { display: flex; gap: 8px; }
  .card input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
                font: inherit; background: var(--bg); color: var(--text); direction: ltr; }
  .card small { color: var(--muted); display: block; margin-top: 10px; }
  form { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  form .wrap { flex-direction: row; gap: 8px; }
  textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
             padding: 10px 14px; font: inherit; background: var(--bg); color: var(--text); max-height: 160px; }
  textarea:focus, .card input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button.send { border: 0; border-radius: 12px; background: var(--accent); color: #fff;
                padding: 0 20px; font: inherit; font-weight: 500; cursor: pointer; }
  button.send:disabled, form textarea:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="logo">م</div>
  <div class="grow">
    <h1>مساري</h1>
    <p>المرشد الأكاديمي لبرنامج هندسة الذكاء الاصطناعي - هندسة المنصورة</p>
  </div>
  <button class="ghost" id="keyBtn" type="button" hidden>تغيير المفتاح</button>
</header>

<main id="chat"><div class="wrap" id="log"></div></main>

<form id="form">
  <div class="wrap">
    <textarea id="q" rows="1" placeholder="اكتب سؤالك هنا..."></textarea>
    <button class="send" id="send" type="submit">إرسال</button>
  </div>
</form>

<template id="setupTpl">
  <div class="card">
    <h2>قبل ما نبدأ: مفتاح Gemini 🔑</h2>
    <div>مساري بيستخدم Gemini، ومحتاج مفتاح API مجاني خاص بيك (مرة واحدة بس):</div>
    <ol>
      <li>افتح <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> وسجل بحساب جوجل.</li>
      <li>دوس <b>Create API key</b> وانسخ المفتاح.</li>
      <li>الصقه هنا ودوس حفظ.</li>
    </ol>
    <div class="row">
      <input id="keyInput" type="password" placeholder="AIza..." autocomplete="off">
      <button class="send" id="saveKey" type="button">حفظ</button>
    </div>
    <small>المفتاح بيتحفظ في المتصفح بتاعك بس، وبيتبعت لجوجل مباشرة. مش بيتبعت لأي حد تاني.</small>
  </div>
</template>

<template id="welcomeTpl">
  <div class="welcome">
    <h2>أهلاً بيك! 👋</h2>
    <div>اسألني أي حاجة عن اللائحة أو التسجيل أو المواد، بالعربي أو الإنجليزي أو العامية.</div>
    <div class="suggest">
      <button>اقدر اسجل كام ساعة لو معدلي 2.5؟</button>
      <button>ايه المتطلبات السابقة لـ ARI 381؟</button>
      <button>امتى الطالب ياخد إنذار أكاديمي؟</button>
      <button>ايه شروط التخرج؟</button>
      <button>ايه مواد الترم الخامس؟</button>
    </div>
  </div>
</template>

<script id="masari-data" type="application/json">__MASARI_DATA__</script>
<script>
// ------------------------------------------------------------------ data
const D = JSON.parse(document.getElementById("masari-data").textContent);
const CHUNKS = D.chunks;
const BY_ID = Object.fromEntries(CHUNKS.map((c, i) => [c.id, i]));
const VECS = (() => {  // int8 -> normalized Float32 rows
  const bytes = Uint8Array.from(atob(D.vecs), ch => ch.charCodeAt(0));
  const i8 = new Int8Array(bytes.buffer);
  const out = [];
  for (let r = 0; r < CHUNKS.length; r++) {
    const row = Float32Array.from(i8.subarray(r * D.dim, (r + 1) * D.dim));
    out.push(normalize(row));
  }
  return out;
})();

function normalize(v) {
  let n = 0; for (const x of v) n += x * x; n = Math.sqrt(n) || 1;
  return v.map(x => x / n);
}

// ------------------------------------------------------------------ BM25 (same as rank_bm25.BM25Okapi)
function tokenize(text) {
  text = text.toLowerCase().replace(/[ً-ْـ]/g, "")
    .replace(/[إأآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي")
    .replace(/\b([a-z]{3})\s+(\d{3})\b/g, "$1$2");
  const tokens = text.match(/[\p{L}\p{N}\p{M}_]+/gu) || [];
  return tokens.map(t => t.startsWith("ال") && t.length > 4 ? t.slice(2) : t);
}

const BM25 = (() => {
  const k1 = 1.5, b = 0.75, eps = 0.25;
  const docs = CHUNKS.map(c => tokenize(c.title + " " + c.text));
  const tf = docs.map(d => { const m = new Map(); for (const t of d) m.set(t, (m.get(t) || 0) + 1); return m; });
  const lens = docs.map(d => d.length), avg = lens.reduce((a, x) => a + x, 0) / docs.length;
  const df = new Map(); for (const m of tf) for (const t of m.keys()) df.set(t, (df.get(t) || 0) + 1);
  const idf = new Map(); let sum = 0; const neg = [];
  for (const [t, f] of df) { const v = Math.log(docs.length - f + 0.5) - Math.log(f + 0.5); idf.set(t, v); sum += v; if (v < 0) neg.push(t); }
  const floor = eps * sum / idf.size; for (const t of neg) idf.set(t, floor);
  return q => tf.map((m, i) => q.reduce((s, t) => {
    const f = m.get(t) || 0;
    return s + (idf.get(t) || 0) * f * (k1 + 1) / (f + k1 * (1 - b + b * lens[i] / avg));
  }, 0));
})();

const rankDesc = scores => scores.map((s, i) => [s, i]).sort((a, b) => b[0] - a[0]).map(x => x[1]);

// ------------------------------------------------------------------ Gemini
const API = "https://generativelanguage.googleapis.com/v1beta/models/";
const cooldown = {};
let apiKey = load("masari_gemini_key");

function load(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }
function save(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }

async function gemini(model, method, body, timeoutMs = D.timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(`${API}${model}:${method}`, {
      method: "POST", signal: ctrl.signal,
      headers: {"Content-Type": "application/json", "x-goog-api-key": apiKey},
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error?.message || res.statusText), {code: res.status});
    return data;
  } catch (e) {
    if (e.name === "AbortError") throw Object.assign(new Error("timeout"), {code: "timeout"});
    throw e;
  } finally { clearTimeout(timer); }
}

const textOf = r => (r.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function embedQuery(text) {
  const r = await gemini(D.embedModel, "embedContent", {
    content: {parts: [{text}]}, taskType: "RETRIEVAL_QUERY", outputDimensionality: D.dim,
  });
  return normalize(Float32Array.from(r.embedding.values));
}

async function rewrite(question, history) {
  const hist = history.slice(-6).map(m => `${m.role}: ${m.content.slice(0, 400)}`).join("\n") || "(لا يوجد)";
  const prompt = D.rewritePrompt.replace("{history}", hist).replace("{question}", question);
  try {
    return textOf(await gemini(D.rewriteModel, "generateContent", {contents: [{role: "user", parts: [{text: prompt}]}]})).trim() || question;
  } catch (e) {
    if (e.code === 400 || e.code === 403) throw e;  // bad key: show it to the user
    return question;
  }
}

async function search(queries) {
  const scores = new Array(CHUNKS.length).fill(0);
  for (const q of queries) {
    const rankings = [rankDesc(BM25(tokenize(q)))];
    try {
      const qv = await embedQuery(q);
      rankings.push(rankDesc(VECS.map(v => v.reduce((s, x, i) => s + x * qv[i], 0))));
    } catch { /* embedding quota hit: keyword search still works */ }
    for (const ranking of rankings)
      ranking.slice(0, 30).forEach((idx, rank) => { scores[idx] += 1 / (60 + rank); });
  }
  for (const code of queries.join(" ").match(/[A-Za-z]{3}\s?\d{3}/g) || []) {
    const id = `course-${code.slice(0, 3).toUpperCase()} ${code.slice(-3)}`;
    if (id in BY_ID) scores[BY_ID[id]] += 1;
  }
  return rankDesc(scores).slice(0, D.topK).map(i => CHUNKS[i]);
}

async function answer(question, history) {
  const searchQ = await rewrite(question, history);
  const hits = await search([...new Set([searchQ, question])]);
  const context = hits.map(h => `[${h.title}]\n${h.text}`).join("\n\n");
  const contents = history.slice(-10).map(m => ({role: m.role === "user" ? "user" : "model", parts: [{text: m.content}]}));
  contents.push({role: "user", parts: [{text:
    `القواعد الرسمية (JSON):\n${D.rules}\n\nالمعلومات المرجعية:\n${context}\n\nسؤال الطالب: ${question}`}]});
  const body = {systemInstruction: {parts: [{text: D.systemPrompt}]}, contents, generationConfig: {temperature: 0.2}};

  // If a model is busy, out of quota or too slow, fall back to the next one.
  let models = [...new Set([D.chatModel, ...D.fallbackModels])].filter(m => !(cooldown[m] > Date.now()));
  if (!models.length) models = D.fallbackModels.slice(-1);
  for (let i = 0; i < models.length; i++) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const r = await gemini(models[i], "generateContent", body);
        return {answer: textOf(r), hits};
      } catch (e) {
        if (e.code === 503 && attempt === 0) { await sleep(2000); continue; }
        if (e.code === 429) cooldown[models[i]] = Date.now() + 300000;
        if (![404, 429, 503, "timeout"].includes(e.code) || i === models.length - 1) throw e;
        break;
      }
    }
  }
}

// ------------------------------------------------------------------ UI
const log = document.getElementById("log");
const chatBox = document.getElementById("chat");
const input = document.getElementById("q");
const sendBtn = document.getElementById("send");
const keyBtn = document.getElementById("keyBtn");
const history = [];
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function showSetup() {
  log.replaceChildren(document.getElementById("setupTpl").content.cloneNode(true));
  input.disabled = sendBtn.disabled = true; keyBtn.hidden = true;
  const keyInput = document.getElementById("keyInput");
  keyInput.focus();
  const submit = () => {
    const k = keyInput.value.trim();
    if (!k) return;
    apiKey = k; save("masari_gemini_key", k);
    showWelcome();
  };
  document.getElementById("saveKey").onclick = submit;
  keyInput.onkeydown = e => { if (e.key === "Enter") submit(); };
}

function showWelcome() {
  history.length = 0;
  log.replaceChildren(document.getElementById("welcomeTpl").content.cloneNode(true));
  log.querySelectorAll(".suggest button").forEach(b => b.onclick = () => ask(b.textContent));
  input.disabled = sendBtn.disabled = false; keyBtn.hidden = false;
  input.focus();
}

function add(cls, html) {
  log.querySelector(".welcome")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  log.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function explain(e) {
  if (e.code === 400 || e.code === 403) return "المفتاح شكله غلط أو مش شغال. دوس \"تغيير المفتاح\" فوق وجرب مفتاح تاني.";
  if (e.code === 429) return "خلصت الكوتة المجانية للمفتاح ده دلوقتي. استنى دقيقة وجرب تاني.";
  if (e.code === 503 || e.code === "timeout") return "سيرفرات Gemini عليها ضغط دلوقتي. جرب تاني كمان شوية.";
  if (e instanceof TypeError) return "مفيش اتصال بالإنترنت أو الطلب اتمنع.";
  return "حصلت مشكلة: " + e.message;
}

async function ask(question) {
  add("user", escapeHtml(question));
  const pending = add("bot typing", "مساري بيدور في اللائحة...");
  sendBtn.disabled = true;
  try {
    const {answer: text, hits} = await answer(question, history);
    const chips = hits.map(h => `<span class="chip">${escapeHtml(h.title)}</span>`).join("");
    pending.className = "msg bot";
    pending.innerHTML = marked.parse(text || "") +
      `<details><summary>المصادر اللي اتبحث فيها</summary><div class="chips">${chips}</div></details>`;
    history.push({role: "user", content: question}, {role: "assistant", content: text || ""});
  } catch (e) {
    pending.className = "msg bot error";
    pending.textContent = explain(e);
  } finally {
    sendBtn.disabled = false;
    chatBox.scrollTop = chatBox.scrollHeight;
    input.focus();
  }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || sendBtn.disabled) return;
  input.value = ""; input.style.height = "auto";
  ask(q);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
keyBtn.onclick = () => { save("masari_gemini_key", ""); apiKey = ""; showSetup(); };

apiKey ? showWelcome() : showSetup();
</script>
</body>
</html>
