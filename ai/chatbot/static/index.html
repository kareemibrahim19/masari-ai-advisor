<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساري - المرشد الأكاديمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa; --panel: #ffffff; --text: #1d2433; --muted: #6b7385;
    --accent: #2b59c3; --accent-soft: #e8eefb; --user: #2b59c3; --user-text: #fff;
    --border: #e1e4ec; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b; --panel: #1a1f2a; --text: #e6e9f0; --muted: #9aa3b5;
      --accent: #6d95ff; --accent-soft: #232c40; --user: #3a63d0; --user-text: #fff;
      --border: #2a3142; --err: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; height: 100dvh;
         display: flex; flex-direction: column; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; align-items: center; gap: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff;
          display: grid; place-items: center; font-weight: 700; font-size: 20px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 16px; border-radius: 14px; line-height: 1.8; max-width: 88%;
         overflow-wrap: anywhere; }
  .user { align-self: flex-start; background: var(--user); color: var(--user-text); white-space: pre-wrap; }
  .bot { align-self: flex-end; background: var(--panel); border: 1px solid var(--border); }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0; padding-inline-start: 22px; }
  .error { color: var(--err); }
  details { margin-top: 10px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
  .typing { color: var(--muted); font-size: 14px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .suggest button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
                    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .suggest button:hover { border-color: var(--accent); }
  .welcome { text-align: center; color: var(--muted); margin-top: 8vh; }
  .welcome h2 { color: var(--text); margin-bottom: 6px; }
  form { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  form .wrap { flex-direction: row; gap: 8px; }
  textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
             padding: 10px 14px; font: inherit; background: var(--bg); color: var(--text);
             max-height: 160px; }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button.send { border: 0; border-radius: 12px; background: var(--accent); color: #fff;
                padding: 0 20px; font: inherit; font-weight: 500; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="logo">م</div>
  <div>
    <h1>مساري</h1>
    <p>المرشد الأكاديمي لبرنامج هندسة الذكاء الاصطناعي - هندسة المنصورة</p>
  </div>
</header>

<main id="chat"><div class="wrap" id="log">
  <div class="welcome" id="welcome">
    <h2>أهلاً بيك! 👋</h2>
    <div>اسألني أي حاجة عن اللائحة أو التسجيل أو المواد، بالعربي أو الإنجليزي أو العامية.</div>
    <div class="suggest">
      <button>اقدر اسجل كام ساعة لو معدلي 2.5؟</button>
      <button>ايه المتطلبات السابقة لـ ARI 381؟</button>
      <button>امتى الطالب ياخد إنذار أكاديمي؟</button>
      <button>ايه شروط التخرج؟</button>
      <button>ايه مواد الترم الخامس؟</button>
    </div>
  </div>
</div></main>

<form id="form">
  <div class="wrap">
    <textarea id="q" rows="1" placeholder="اكتب سؤالك هنا..." autofocus></textarea>
    <button class="send" id="send" type="submit">إرسال</button>
  </div>
</form>

<script>
const log = document.getElementById("log");
const chatBox = document.getElementById("chat");
const input = document.getElementById("q");
const sendBtn = document.getElementById("send");
const history = [];

function add(cls, html) {
  document.getElementById("welcome")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  log.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

const escapeHtml = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function ask(question) {
  add("user", escapeHtml(question));
  const pending = add("bot typing", "مساري بيدور في اللائحة...");
  sendBtn.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, history}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    const chips = data.sources.map(s => `<span class="chip">${escapeHtml(s.title)}</span>`).join("");
    pending.className = "msg bot";
    pending.innerHTML = marked.parse(data.answer || "") +
      `<details><summary>المصادر اللي اتبحث فيها</summary><div class="chips">${chips}</div></details>`;
    history.push({role: "user", content: question}, {role: "assistant", content: data.answer || ""});
  } catch (e) {
    pending.className = "msg bot error";
    pending.textContent = "حصلت مشكلة: " + e.message + " — جرب تاني كمان شوية.";
  } finally {
    sendBtn.disabled = false;
    chatBox.scrollTop = chatBox.scrollHeight;
    input.focus();
  }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || sendBtn.disabled) return;
  input.value = ""; input.style.height = "auto";
  ask(q);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
document.querySelectorAll(".suggest button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
</script>
</body>
</html>
