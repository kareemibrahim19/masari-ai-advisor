<style>
/* ============================================================ Tokens
   Brand palette
     Masari Blue #13235C  oklch(.283 .104 267)  (sampled from the logo artwork)
     Amber       oklch(.78 .15 62)  accent, focus, the "destination" dot. A fill color:
                 text on light surfaces uses --highlight-ink instead.
     Paper       oklch(.985 .004 85)  page background
   Semantic trust colors, kept separate from the brand:
   --verified : deterministic rules-engine result    (green)
   --ai       : LLM-written explanation              (violet)
   --source   : RAG citation to an official document (teal)
   --warning  : alerts, low confidence, limited data (orange)            */
:root{
  --brand-blue:#13235c;--brand-amber:oklch(.78 .15 62);--brand-paper:oklch(.985 .004 85);--brand-ink:var(--brand-blue);
  --background:var(--brand-paper);--foreground:#141a33;--card:#fff;--primary:var(--brand-blue);--primary-fg:var(--brand-paper);
  --secondary:#e9ecf5;--secondary-fg:var(--brand-blue);--muted:#f1f0eb;--muted-fg:#596075;--border:#e4e2db;
  --destructive:#c62828;--destructive-soft:rgb(198 40 40 / .09);--ring:oklch(.78 .15 62 / .7);--sidebar:#fff;--chart2:#5b6fb5;
  --verified:#15803d;--verified-soft:#e7f6ec;--ai:#6d28d9;--ai-soft:#f1ecfd;--source:#0e7490;--source-soft:#e3f4f7;
  --warning:#c2410c;--warning-soft:#fdeee4;--highlight:var(--brand-amber);--highlight-soft:oklch(.78 .15 62 / .16);--highlight-ink:#9a5410;
  --cat-dept:var(--brand-blue);--cat-dept-soft:rgb(19 35 92 / .09);
  --radius:12px;--shadow:0 1px 2px rgb(19 35 92 / .05);
}
:root.dark{
  --brand-ink:var(--brand-paper);
  --background:#0b1127;--foreground:#ecebe6;--card:#121a36;--primary:var(--brand-amber);--primary-fg:var(--brand-blue);
  --secondary:#1c2750;--secondary-fg:#dce1f2;--muted:#172042;--muted-fg:#a3abc2;--border:rgb(255 255 255 / .09);
  --destructive:#f87171;--destructive-soft:rgb(248 113 113 / .12);--ring:oklch(.78 .15 62 / .6);--sidebar:#0e1530;--chart2:#8ea2e0;
  --verified:#4ade80;--verified-soft:rgb(74 222 128 / .12);--ai:#b79cfb;--ai-soft:rgb(167 139 250 / .14);
  --source:#5ec4d9;--source-soft:rgb(94 196 217 / .12);--warning:#fb923c;--warning-soft:rgb(251 146 60 / .12);
  --highlight-soft:oklch(.78 .15 62 / .14);--highlight-ink:var(--brand-amber);--cat-dept:#b4c1ee;--cat-dept-soft:rgb(142 162 224 / .16);--shadow:none;
}

/* ============================================================ Base */
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
html.dark{color-scheme:dark}
body{margin:0;background:var(--background);color:var(--foreground);font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:16px;height:16px;flex-shrink:0}
.i-sm{width:14px;height:14px}.i-lg{width:20px;height:20px}
.num{font-variant-numeric:tabular-nums}
.code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;letter-spacing:-.01em}
.muted{color:var(--muted-fg)}
.xs{font-size:12px}.xxs{font-size:11px}
.flip-rtl{transform:none}[dir=rtl] .flip-rtl{transform:scaleX(-1)}
.flip-ltr{transform:none}[dir=ltr] .flip-ltr{transform:scaleX(-1)}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:20px}
.stack-sm>*+*{margin-top:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================================================ Shell */
.app{display:flex;min-height:100dvh}
.sidebar{position:sticky;top:0;height:100dvh;width:256px;flex-shrink:0;display:flex;flex-direction:column;gap:24px;padding:16px;background:var(--sidebar);border-inline-end:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;padding:4px;border-radius:10px;color:var(--brand-ink)}
.mark{flex-shrink:0;color:var(--brand-ink)}
[dir=rtl] .mark{transform:scaleX(-1)} /* the path reads in the language direction, as in the Arabic lockup */
.mark .dot{fill:var(--brand-amber)}
.logo-name{display:block;font-weight:700;font-size:22px;line-height:1;letter-spacing:-.01em}
.logo-sub{display:block;margin-top:4px;font-size:13px;font-weight:500;line-height:1;opacity:.75}
.app-icon{border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px var(--border)}
.top-mark{display:none;border-radius:6px}
@media (max-width:1023px){.top-mark{display:inline-flex}}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-weight:500;color:var(--muted-fg);transition:background .15s,color .15s}
.nav a:hover{background:var(--muted);color:var(--foreground)}
.nav a[aria-current=page]{background:var(--secondary);color:var(--secondary-fg)}
.nav a[aria-current=page] .i{color:var(--primary)}
.nav a[aria-current=page]::before{content:"";position:absolute;inset-block:10px;inset-inline-start:-16px;width:4px;border-start-end-radius:4px;border-end-end-radius:4px;background:var(--brand-amber)}
.student-card{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius)}
.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--secondary);color:var(--secondary-fg);font-weight:700;flex-shrink:0}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--background) 85%,transparent);backdrop-filter:blur(8px)}
.topbar h1{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .actions{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.menu-btn{display:none}
.scrim{display:none}
main{flex:1;min-width:0;display:flex;flex-direction:column}
@media (max-width:1023px){
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;z-index:50;inset-block:0;inset-inline-start:0;width:288px;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 10px 30px rgb(0 0 0 / .2)}
  [dir=rtl] .sidebar{transform:translateX(105%)}
  body.drawer-open .sidebar{transform:none}
  body.drawer-open .scrim{display:block;position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .25)}
}
@media (max-width:639px){.topbar{padding:0 12px}.hide-sm{display:none!important}}

/* ============================================================ Primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:none;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover:not(:disabled){background:color-mix(in srgb,var(--primary) 85%,var(--foreground))}
.btn-outline{border-color:var(--border);background:var(--card)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost:hover{background:var(--muted)}
.btn-secondary{background:var(--secondary);color:var(--secondary-fg)}
.btn-icon{width:40px;padding:0}
.btn-sm{height:32px;padding:0 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card-sm{padding:12px}
.card-title{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:17px;font-weight:600}
.card-desc{color:var(--muted-fg);margin-top:2px}
.card-head{margin-bottom:16px}
.card.ring{border-color:color-mix(in srgb,var(--primary) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 35%,transparent)}
.card.ring-danger{border-color:color-mix(in srgb,var(--destructive) 55%,transparent)}
.card.ring-warn{border-color:color-mix(in srgb,var(--warning) 60%,transparent)}
.pill{position:relative;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;width:fit-content}
.pill .i{width:14px;height:14px}
.pill-verified{background:var(--verified-soft);color:var(--verified)}
.pill-ai{background:var(--ai-soft);color:var(--ai)}
.pill-demo{background:var(--warning-soft);color:var(--warning)}
.pill-plain{background:none;padding:0;height:20px}
.pill-mini{height:20px;padding:0 6px;font-size:10px}
.pill-muted{background:var(--muted);color:var(--muted-fg)}
[data-tip]{cursor:help}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:60;bottom:calc(100% + 8px);inset-inline-start:0;width:max-content;max-width:260px;white-space:normal;padding:6px 10px;border-radius:8px;background:var(--foreground);color:var(--background);font-size:12px;font-weight:400;line-height:1.45;pointer-events:none}
.source{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 8px;border-radius:8px;border:1px solid color-mix(in srgb,var(--source) 22%,transparent);background:var(--source-soft);color:var(--source);font-size:12px}
.source b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.source span{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-exp{border-inline-start:2px solid color-mix(in srgb,var(--ai) 60%,transparent);background:color-mix(in srgb,var(--ai-soft) 70%,transparent);border-radius:10px;padding:10px 12px}
.ai-exp .ai-label{display:flex;align-items:center;gap:4px;color:var(--ai);font-size:12px;font-weight:500;margin-bottom:6px}
.ai-exp p{line-height:1.7;font-size:14px}
.verified-box{background:color-mix(in srgb,var(--verified-soft) 60%,transparent);border-radius:10px;padding:12px}
.check-list li{display:flex;gap:6px;align-items:flex-start}
.check-list .i{color:var(--verified);margin-top:3px}
.bar{height:8px;width:100%;overflow:hidden;border-radius:999px;background:var(--muted)}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .5s ease}
.bar.thin{height:6px}.bar.thick{height:12px}
.bar>i.ok{background:var(--verified)}.bar>i.bad{background:var(--destructive)}.bar>i.c2{background:var(--chart2)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.tag-faculty{background:var(--secondary);color:var(--secondary-fg)}
.tag-dept{background:var(--cat-dept-soft);color:var(--cat-dept)}
.tag-elective{background:var(--highlight-soft);color:var(--highlight-ink)}
.tag-math{background:var(--muted);color:var(--muted-fg);box-shadow:inset 0 0 0 1px var(--border)}
.chip{display:inline-flex;align-items:center;padding:2px 6px;border-radius:6px;background:var(--muted);font-size:12px}
.chip-danger{background:var(--destructive-soft);color:var(--destructive)}
.chip-warn{background:var(--warning-soft);color:var(--warning)}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.conf .bars{display:flex;align-items:flex-end;gap:2px}
.conf .bars i{width:4px;border-radius:2px;background:color-mix(in srgb,var(--muted-fg) 25%,transparent)}
.conf .bars i.on{background:currentColor}
.c-high{color:var(--verified)}.c-medium{color:var(--warning)}.c-low{color:var(--destructive)}
.rank{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--muted);font-size:12px;font-weight:700;flex-shrink:0}
.list-box{border:1px solid var(--border);border-radius:10px}
.list-box>li+li{border-top:1px solid var(--border)}
.icon-tile{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;flex-shrink:0}
.t-warn{background:var(--warning-soft);color:var(--warning)}
.t-info{background:var(--source-soft);color:var(--source)}
.t-ai{background:var(--ai-soft);color:var(--ai)}
.warn-note{display:flex;gap:6px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--warning-soft);color:var(--warning);font-size:12px}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:10px;background:var(--muted)}
.seg button{height:38px;padding:0 20px;border:0;border-radius:8px;background:none;font-weight:500;color:var(--muted-fg)}
.seg button[aria-selected=true]{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.choice{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-weight:500;text-align:start;transition:background .15s,border-color .15s}
.choice:hover{background:var(--muted)}
.choice[aria-checked=true]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--card))}

/* ============================================================ Pages */
.page{width:100%;max-width:1280px;margin:0 auto;padding:24px}
@media (max-width:767px){.page{padding:16px}}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.page-head h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin-top:4px;max-width:680px;color:var(--muted-fg)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:1023px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi-val{font-size:24px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
@media (max-width:1023px){.grid3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
.req-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 32px}
@media (max-width:639px){.req-grid{grid-template-columns:minmax(0,1fr)}}
.side-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.side-layout.rev{grid-template-columns:320px minmax(0,1fr)}
.sticky{position:sticky;top:80px}
@media (max-width:1023px){.side-layout,.side-layout.rev{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:767px){.two{grid-template-columns:minmax(0,1fr)}}
.dims{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 24px}
@media (max-width:639px){.dims{grid-template-columns:minmax(0,1fr)}}
.pref-mark{position:absolute;top:50%;width:2px;height:14px;transform:translateY(-50%);border-radius:2px;background:var(--foreground)}
input[type=range]{width:100%;accent-color:var(--primary);height:24px;cursor:pointer}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.plan-item{border:1px solid var(--border);border-radius:10px;padding:10px;background:color-mix(in srgb,var(--background) 60%,transparent)}
.plan-item.moved{border-color:color-mix(in srgb,var(--warning) 60%,transparent);background:color-mix(in srgb,var(--warning-soft) 70%,transparent)}

/* Chat */
.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;flex:1;min-height:0}
@media (max-width:1023px){.chat-layout{grid-template-columns:minmax(0,1fr)}.chat-side{display:none}}
.chat-main{display:flex;flex-direction:column;height:calc(100dvh - 64px);min-width:0}
.chat-log{flex:1;overflow-y:auto}
.chat-inner{max-width:768px;margin:0 auto;padding:24px}
@media (max-width:767px){.chat-inner{padding:16px}}
.chat-inner>*+*{margin-top:24px}
.bubble-user{display:flex;justify-content:flex-end}
.bubble-user p{max-width:85%;padding:10px 16px;border-radius:18px;border-start-end-radius:4px;background:var(--primary);color:var(--primary-fg);line-height:1.6}
.msg{display:flex;gap:12px}
.msg-avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--primary);color:var(--primary-fg);flex-shrink:0;margin-top:2px}
.msg-body{flex:1;min-width:0}
.msg-body>*+*{margin-top:12px}
.composer-wrap{border-top:1px solid var(--border);background:color-mix(in srgb,var(--background) 92%,transparent)}
.composer-inner{max-width:768px;margin:0 auto;padding:12px 24px}
@media (max-width:767px){.composer-inner{padding:12px 16px}}
.suggests{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:12px}
.suggests button{height:36px;flex-shrink:0;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:500;color:var(--muted-fg)}
.suggests button:hover{border-color:color-mix(in srgb,var(--primary) 40%,transparent);color:var(--foreground)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px;border:1px solid var(--border);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.composer:focus-within{box-shadow:0 0 0 3px var(--ring)}
.composer textarea{flex:1;min-height:44px;max-height:160px;resize:none;border:0;outline:0;background:none;padding:10px 4px;font:inherit;font-size:15px;color:inherit;line-height:1.5}
.composer .btn{width:44px;height:44px;padding:0;border-radius:12px}
.listening{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--primary) 9%,transparent);color:var(--primary)}
.pulse{position:relative;width:10px;height:10px}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--primary)}
.pulse::before{animation:ping 1.2s cubic-bezier(0,0,.2,1) infinite;opacity:.6}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
.typing{display:flex;gap:4px;width:fit-content;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.typing i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--muted-fg) 60%,transparent);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.chat-side{height:calc(100dvh - 64px);overflow-y:auto;padding:20px;background:var(--sidebar);border-inline-start:1px solid var(--border)}
.chat-side>*+*{margin-top:24px}
.dl{border:1px solid var(--border);border-radius:10px;background:var(--card)}
.dl>div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px}
.dl>div+div{border-top:1px solid var(--border)}
.proto-banner{padding:6px 16px;text-align:center;font-size:12px;background:var(--warning-soft);color:var(--warning)}

/* ============================================================ AIE program additions */
.tag{font-family:"IBM Plex Mono",ui-monospace,monospace}
.tag-CSE{background:var(--cat-dept-soft);color:var(--cat-dept)}
.tag-ECE{background:color-mix(in srgb,var(--chart2) 15%,transparent);color:var(--chart2)}
.tag-BAS{background:var(--secondary);color:var(--secondary-fg)}
.tag-ARI{background:var(--highlight-soft);color:var(--highlight-ink)}
.tag-UNR,.tag-ENG,.tag-ELE,.tag-PDE{background:var(--muted);color:var(--muted-fg);box-shadow:inset 0 0 0 1px var(--border)}
.slot{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;border:1px dashed var(--highlight);color:var(--highlight-ink);font:500 11px "IBM Plex Mono",ui-monospace,monospace;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:4px;height:24px;width:fit-content;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.st-passed{background:var(--verified-soft);color:var(--verified)}
.st-failed{background:var(--destructive-soft);color:var(--destructive)}
.st-eligible{background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary)}
.st-locked{background:var(--muted);color:var(--muted-fg)}
.st-note{display:block;margin-top:2px;font-size:11px;color:var(--muted-fg)}
.under{display:flex;gap:4px;align-items:flex-start;margin-top:6px;font-size:11px;color:var(--warning)}
.bar>i.warn{background:var(--warning)}
.empty-term{background:color-mix(in srgb,var(--muted) 45%,var(--card))}
.note-line{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted-fg);margin:16px 0}

/* stats + filters */
.stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1279px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:639px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat-val{font-size:20px;font-weight:700;color:var(--primary)}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1279px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}.filters .f-search{grid-column:1/-1}}
@media (max-width:767px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{min-width:0}
.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--muted-fg)}
.field select,.field input{width:100%;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:inherit;font:inherit;font-size:14px}
.field select:focus-visible,.field input:focus-visible{outline:3px solid var(--ring);outline-offset:0}
.search-wrap{position:relative}
.search-wrap .i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted-fg);pointer-events:none}
.search-wrap input{padding-inline-start:36px}
.filter-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}

/* catalog rows */
.crow{border:1px solid var(--border);border-radius:12px;background:var(--card)}
.crow.slot-row{border-style:dashed;border-color:color-mix(in srgb,var(--highlight) 60%,transparent)}
.crow.open{box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 25%,transparent)}
.crow+.crow{margin-top:8px}
.crow-btn{display:grid;width:100%;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:12px;border:0;border-radius:12px;background:none;text-align:start}
.crow-btn .md{display:none}
.crow-btn .sm-only{display:inline}
@media (min-width:768px){
  .crow-btn{grid-template-columns:6.5rem minmax(0,1fr) 3rem 7.5rem 7.5rem 1.25rem}
  .crow-btn .md{display:block}
  .crow-btn .sm-only{display:none}
  .crow-btn .status-cell{grid-column:auto;grid-row:auto}
}
@media (min-width:1280px){.crow-btn{grid-template-columns:6.5rem minmax(0,1fr) 3rem 7.5rem minmax(0,11rem) 7.5rem 1.25rem}.crow-btn .xl{display:block}}
.crow-btn .xl{display:none}
.crow-btn .status-cell{grid-column:2;grid-row:1}
.crow-btn .chev{transition:transform .2s;color:var(--muted-fg)}
.crow.open .chev{transform:rotate(180deg)}
.cpanel{padding:16px 12px;border-top:1px solid var(--border)}
@media (min-width:768px){.cpanel{padding-inline-start:calc(6.5rem + 24px)}}
.code-link{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;border:0;border-radius:6px;background:var(--muted);font-size:12px}
.code-link:hover{background:color-mix(in srgb,var(--primary) 10%,var(--muted))}
.code-link.ok{background:var(--verified-soft);color:var(--verified)}
.pool{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:1024px){.pool{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pool li{padding:12px;border:1px solid var(--border);border-radius:10px;background:color-mix(in srgb,var(--background) 60%,transparent)}
.pool li.pick{border-color:var(--highlight)}
.pick-badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;background:var(--highlight-soft);color:var(--highlight-ink);font-size:11px;font-weight:500}
.desc{direction:ltr;text-align:start;font-size:12px;line-height:1.6;color:var(--muted-fg)}

/* regulations */
.reg-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1023px){.reg-grid{grid-template-columns:minmax(0,1fr)}}
.reg-grid .full{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--muted);color:var(--muted-fg);font-size:12px;font-weight:500;text-align:start;padding:8px 12px}
.tbl td{padding:8px 12px;border-top:1px solid var(--border)}
.tbl tr.mine td{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mine-badge{margin-inline-start:8px;display:inline-flex;height:20px;align-items:center;padding:0 8px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:11px;font-weight:500}
.bullets{padding-inline-start:20px;list-style:disc;font-size:14px;line-height:1.7}
.bullets li+li{margin-top:4px}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden}
.assess{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:767px){.assess{grid-template-columns:minmax(0,1fr)}}
.conflict{padding:12px;border-radius:10px;background:var(--warning-soft);color:var(--warning);font-size:12px;line-height:1.6}

/* ============================================================ Brand 8f: Charcoal + Orange (overrides earlier tokens)
   Orange is the single accent and a FILL colour only; text uses --highlight-ink.
   Provenance by form: solid green = rule-verified, dashed = AI wording, outlined doc chip = source. */
:root{
  --brand-ink:#1E2230;--brand-accent:#F27A2E;
  --background:#F8F8F7;--foreground:#14161F;--card:#FFFFFF;--primary:#1E2230;--primary-fg:#FFFFFF;
  --secondary:#EEEFF3;--secondary-fg:#1E2230;--muted:#EEEFF3;--muted-fg:#61657A;--border:#E4E4E2;
  --destructive:#B53A2F;--destructive-soft:rgb(209 75 63 / .1);--ring:rgb(242 122 46 / .55);--sidebar:#FFFFFF;--chart2:#4B4F62;
  --verified:#1F7A50;--verified-soft:rgb(46 158 106 / .12);--ai:#4B4F62;--ai-soft:#F2F3F6;--source:#1E2230;--source-soft:#FFFFFF;
  --warning:#8A5D00;--warning-soft:rgb(224 161 27 / .15);--highlight:#F27A2E;--highlight-soft:rgb(242 122 46 / .12);--highlight-ink:#B4501A;
  --cat-dept:#1E2230;--cat-dept-soft:#EEEFF3;--radius:14px;--shadow:none;
}
:root.dark{
  --brand-ink:#FFFFFF;
  --background:#12141B;--foreground:#F2F2F0;--card:#1B1E28;--primary:#F27A2E;--primary-fg:#14161F;
  --secondary:#252A38;--secondary-fg:#F2F2F0;--muted:#252A38;--muted-fg:#A3A7B6;--border:#2A2E3B;
  --destructive:#EF7A6E;--destructive-soft:rgb(239 122 110 / .14);--ring:rgb(242 122 46 / .6);--sidebar:#1B1E28;--chart2:#C3C6D2;
  --verified:#4CC08A;--verified-soft:rgb(46 158 106 / .16);--ai:#C3C6D2;--ai-soft:#20232E;--source:#F2F2F0;--source-soft:#1B1E28;
  --warning:#F0B840;--warning-soft:rgb(224 161 27 / .14);--highlight-soft:rgb(242 122 46 / .14);--highlight-ink:#F27A2E;
  --cat-dept:#F2F2F0;--cat-dept-soft:#252A38;
}
body{font-family:"Sora","Readex Pro",system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:lang(ar){font-family:"Readex Pro","Sora",system-ui,sans-serif}
:lang(ar) :lang(en),bdi[dir=ltr]{font-family:"Sora",system-ui,sans-serif}
.code,.tag,.slot,.tagline{font-family:"JetBrains Mono",ui-monospace,monospace}
::selection{background:rgb(242 122 46 / .25)}
.btn{transition:background-color .15s,color .15s,border-color .15s,transform .15s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary:hover:not(:disabled){background:color-mix(in srgb,var(--primary) 88%,var(--background))}
.card{border-radius:14px}
.chip{border-radius:6px}
.page-head h2,.page-head h1{font-size:28px;font-weight:600;line-height:1.25}
:lang(en) .page-head h1{letter-spacing:-.02em}
.page-head p{max-width:62ch;font-size:15px}

/* provenance by form */
.pill-ai{background:transparent;border:1px dashed color-mix(in srgb,var(--ai) 50%,transparent)}
.ai-exp{border:1px dashed color-mix(in srgb,var(--ai) 40%,transparent);border-radius:12px;background:var(--ai-soft);padding:12px 14px}
.ai-exp .ai-label{color:var(--ai)}
.ai-exp p{max-width:68ch}
.source{border:1px solid var(--border);background:var(--source-soft);color:var(--source)}
.source span{color:var(--muted-fg);opacity:1}

/* tags: one accent */
.tag-CSE{background:var(--cat-dept-soft);color:var(--cat-dept)}
.tag-ECE{background:transparent;color:var(--foreground);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--foreground) 30%,transparent)}
.tag-BAS,.tag-UNR,.tag-ENG,.tag-ELE,.tag-PDE{background:var(--muted);color:var(--muted-fg);box-shadow:inset 0 0 0 1px var(--border)}

/* ============================================================ Shell: top bar (desktop) + bottom tabs (mobile) */
.skip{position:fixed;inset-inline-start:16px;top:-60px;z-index:60;padding:8px 16px;border-radius:10px;background:var(--primary);color:var(--primary-fg)}
.skip:focus{top:12px}
.proto-banner{padding:6px 16px;font-size:12px}
.topbar{position:sticky;top:0;z-index:30;height:auto;padding:0;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--background) 86%,transparent);backdrop-filter:blur(8px)}
.topbar-inner{display:flex;align-items:center;gap:24px;max-width:1280px;height:64px;margin:0 auto;padding:0 24px}
@media (max-width:767px){.topbar-inner{padding:0 16px;gap:12px}}
.topbar .actions{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
.lockup{display:flex;align-items:center;gap:8px;border-radius:10px;color:var(--brand-ink)}
.lockup .mark{width:32px;height:32px}
.lockup-name{display:block;font-size:19px;font-weight:700;line-height:1}
:lang(ar) .lockup-name{font-weight:600}
.lockup-sub{display:block;margin-top:4px;font-size:11px;font-weight:600;line-height:1;color:var(--muted-fg)}
.topnav{display:none;align-self:stretch;gap:4px}
@media (min-width:1024px){.topnav{display:flex}}
.topnav a{position:relative;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;font-weight:500;color:var(--muted-fg);white-space:nowrap}
.topnav a:hover{color:var(--foreground)}
.topnav a::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:2px;border-radius:2px;background:transparent}
.topnav a[aria-current=page]{color:var(--foreground)}
.topnav a[aria-current=page]::after{background:var(--brand-accent)}
.topnav .full{display:none}
@media (min-width:1536px){.topnav .full{display:inline}.topnav .short{display:none}}
.student-chip{display:flex;flex-shrink:0;align-items:center;gap:10px;padding-inline-start:8px;white-space:nowrap}
.student-chip .sq{flex-shrink:0}

.student-chip .sq{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--primary-fg);font-weight:600}
.bottomnav{position:fixed;inset-inline:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--border);background:color-mix(in srgb,var(--background) 90%,transparent);backdrop-filter:blur(8px)}
.bottomnav ul{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;height:64px;margin:0 auto}
.bottomnav a{position:relative;display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted-fg)}
.bottomnav a[aria-current=page]{color:var(--foreground)}
.bottomnav a::before{content:"";position:absolute;top:0;width:32px;height:2px;border-radius:0 0 2px 2px;background:transparent}
.bottomnav a[aria-current=page]::before{background:var(--brand-accent)}
.bottomnav .i{width:20px;height:20px}
@media (min-width:1024px){.bottomnav{display:none}}
main{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
@media (min-width:1024px){main{padding-bottom:0}}
.chat-main,.chat-side{height:calc(100dvh - 128px - env(safe-area-inset-bottom))}
@media (min-width:1024px){.chat-main,.chat-side{height:calc(100dvh - 64px)}}

/* ============================================================ Dashboard */
.dash{width:100%;max-width:1280px;margin:0 auto;padding:40px 24px}
@media (max-width:767px){.dash{padding:24px 16px}}
.dash>*+*{margin-top:40px}
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.hero-row h1{font-size:36px;font-weight:600;line-height:1.2}
@media (max-width:767px){.hero-row h1{font-size:30px}}
:lang(en) .hero-row h1{letter-spacing:-.02em}
.hero-row p{margin-top:8px;max-width:52ch;font-size:17px;color:var(--muted-fg)}
.hero-row p b{color:var(--foreground);font-weight:600}
.btn-lg{height:40px;padding:0 16px}
.path-card{padding:20px 24px 16px;border:1px solid var(--border);border-radius:18px;background:var(--card)}
@media (max-width:767px){.path-card{padding:16px}}
.path-legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:12px;color:var(--muted-fg)}
.path-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:10px;height:10px;border-radius:50%}
.rail-full{display:block;overflow-x:auto}
.rail-compact{display:none}
@media (max-width:639px){.rail-full{display:none}.rail-compact{display:block}}
.rail-full svg{min-width:720px}
.rail svg{display:block;width:100%;height:auto}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:24px 0;border-block:1px solid var(--border)}
.stat-row>div{padding:0 24px}
.stat-row>div+div{border-inline-start:1px solid var(--border)}
.stat-row>div:first-child{padding-inline-start:0}
@media (max-width:767px){.stat-row{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:24px}.stat-row>div{padding:0}.stat-row>div+div{border:0}}
.stat-row .lbl{font-size:14px;color:var(--muted-fg)}
.stat-row .val{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.stat-row .big{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-row .hint{margin-top:6px;font-size:12px;line-height:1.4;color:var(--muted-fg)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px}
@media (max-width:1023px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-head h2{font-size:20px;font-weight:600}
.plist{border:1px solid var(--border);border-radius:18px;background:var(--card);overflow:hidden}
.plist>li{display:flex;align-items:center;gap:16px;padding:14px 16px}
.plist>li+li{border-top:1px solid var(--border)}
.prio{width:56px;text-align:end}
.prio b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.prio span{display:block;font-size:11px;color:var(--muted-fg)}
.alert-card{display:flex;gap:12px;padding:16px;border:1px solid var(--border);border-radius:18px;background:var(--card)}
.alert-card+.alert-card{margin-top:12px}
.text-link{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:14px;font-weight:500;color:var(--highlight-ink)}
.text-link:hover{text-decoration:underline;text-underline-offset:4px}
.mark .dot{fill:var(--brand-accent)}
.t-neutral{background:var(--muted);color:var(--foreground)}
.t-orange{background:var(--highlight-soft);color:var(--highlight-ink)}
.bar>i.ink{background:var(--brand-ink)}
.sm-only{display:none}
@media (max-width:639px){.sm-only{display:inline}}

.rail-scroll{overflow-x:auto;overscroll-behavior-x:contain;margin:0 -16px;padding:0 16px 8px;scrollbar-width:thin}
.rail-scroll svg{display:block;max-width:none;height:auto}
@media (min-width:640px){.rail-scroll{margin:0;padding:0 0 4px}.rail-scroll svg{width:100%;min-width:720px}}
.swipe{display:none;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--muted-fg)}
@media (max-width:639px){.swipe{display:flex}}
.profile-btn{display:grid;place-items:center;width:36px;height:36px;margin-inline-start:4px;border:0;border-radius:10px;background:var(--primary);color:var(--primary-fg);font-weight:600;flex-shrink:0}
@media (min-width:1280px){.profile-btn{display:none}}
.topbar-inner{position:relative}
.profile-menu{position:absolute;top:60px;inset-inline-end:16px;z-index:50;width:256px;padding:8px;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 12px 32px rgb(20 22 31 / .14)}
.profile-menu[hidden]{display:none}
.pm-head{display:flex;align-items:center;gap:12px;padding:4px 8px 12px}
.pm-head .sq{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border-radius:10px;background:var(--primary);color:var(--primary-fg);font-weight:600}
.pm-head b{display:block;font-weight:500}
.pm-head .xs{display:block;margin-top:2px;line-height:1.4}
.profile-menu .dl{margin:0 8px 8px}
.pm-link{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:8px;font-size:14px}
.pm-link:hover{background:var(--muted)}

/* profile chip always visible: make room on phones and at 1024–1279 */
@media (max-width:639px){.lockup>span{display:none}.student-chip{padding-inline-start:4px}.topbar .actions{gap:2px}}
.topbar-inner{gap:12px}
@media (min-width:1024px){.topbar-inner{gap:16px}.topnav a{padding:0 8px;gap:6px}}
@media (min-width:1280px){.topbar-inner{gap:24px}.topnav a{padding:0 10px;gap:8px}}
@media (min-width:1024px) and (max-width:1279px){#langBtn .hide-sm{display:none}#langBtn .sm-only{display:inline}}

function demoCompatibility(p, prefs) {
  const paceFit = 100 - Math.abs(p.pace - prefs.pace);
  const workloadFit = 100 - Math.max(0, p.workload - prefs.workload) * 1.2;
  const practicalFit = 100 - Math.abs(p.practical - prefs.practical);
  const fit = (paceFit + workloadFit + practicalFit) / 3;
  return Math.round(Math.max(0, Math.min(100, 0.6 * fit + 0.25 * p.clarity + 0.15 * p.satisfaction)));
}

// "Your path": every connector is the logo's own segment (out of a node upward, into the next from below).
// Desktop scales to the card; phones draw it 1:1, scroll sideways and open on "you are here".
function rail() {
  const STEP = 84, PAD = 48, H = 214, BASE = 136, RISE = 76, k = STEP * 0.24;
  const sem = (c) => (P.courses.find((x) => x.code === c) || {}).semester || 0;
  const completed = Math.max(...D.record.passed.map(sem));
  const nodes = [
    ...Array.from({ length: completed }, (_, i) => ({ kind: "done", label: `${t("semShort")} ${num(i + 1)}`, failed: D.record.failed.some((f) => sem(f) === i + 1) })),
    ...D.baselinePlan.slice(0, D.baselineGraduationIndex + 1).map((term, i) => ({ kind: "term", label: tr(D.semesterNames[i]), credits: term.reduce((s, c) => s + c.credits, 0), empty: term.length === 0, grad: i === D.baselineGraduationIndex })),
  ];
  const W = PAD * 2 + STEP * (nodes.length - 1), rise = RISE / (nodes.length - 1);
  const pts = nodes.map((_, i) => { const x = PAD + i * STEP; return { x: S.lang === "ar" ? W - x : x, y: BASE - i * rise }; });
  const seg = (a, p) => `C${a.x} ${a.y - k} ${p.x} ${p.y + k} ${p.x} ${p.y}`;
  const pathTo = (n) => pts.slice(0, n).map((p, i) => (i ? seg(pts[i - 1], p) : `M${p.x} ${p.y}`)).join(" ");
  const a = pts[completed - 1], b = pts[completed], hx = (a.x + b.x) / 2, hy = (a.y + b.y) / 2;
  const T = (x, y, fill, size, txt, weight = 400) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="${weight}" style="fill:${fill}">${esc(txt)}</text>`;
  const out = nodes.map((n, i) => {

// ------------------------------------------------------------------ plan (precomputed by the planner)
function viewPlan() {
  const sc = D.scenarios.find((s) => s.id === S.scenario) || null;
  const plan = sc ? sc.plan : D.baselinePlan;
  const gradIdx = sc && sc.graduationIndex >= 0 ? sc.graduationIndex : D.baselineGraduationIndex;
  let lastIdx = gradIdx; plan.forEach((tm, i) => { if (tm.length) lastIdx = Math.max(lastIdx, i); });
  const baseIdx = new Map(D.baselinePlan.flatMap((sem, i) => sem.map((c) => [c.code, i])));
  const max = D.student.maxLoad;
  const verdict = { delay: ["clock", "chip-warn"], same: ["checkCircle", ""], infeasible: ["xCircle", "chip-danger"] };
  let result = "";
  if (sc) {
    const [vi, vcls] = verdict[sc.verdict];
    result = `<div class="two"><div class="stack" style="padding:16px;border:1px solid var(--border);border-radius:12px">
      <div class="row wrap between">${verified()}<span class="pill ${vcls}" style="${sc.verdict === "same" ? "background:var(--verified-soft);color:var(--verified)" : ""};font-weight:600">${ic(vi, "i-sm")}${esc(tr(sc.graduation))}</span></div>
      <p class="row" style="align-items:flex-start;gap:6px"><span class="muted">${ic("alert")}</span><bdi>${esc(tr(sc.ruleNote))}</bdi></p>
      ${sc.affected.length ? `<div class="stack-sm"><p class="xs muted">${t("affected")} (${num(sc.affected.length)})</p><div class="row wrap" style="gap:6px">${sc.affected.map((c) => `<span class="chip chip-warn">${code(c)}</span>`).join("")}</div></div>` : ""}
    </div>${aiExp(tr(sc.summary))}</div>`;
  }
  return `<div class="page">
    ${pageHead(t("planTitle"), t("planSubtitle"), `<div class="card card-sm row" style="gap:12px;padding:10px 16px"><span style="color:var(--primary)">${ic("grad", "i-lg")}</span><div><p class="xs muted">${t("estGraduation")}</p><p style="font-weight:600">${esc(sc ? tr(sc.graduation) : tr(D.student.estGraduation))}</p></div></div>`)}
    <div class="card" style="margin-bottom:8px">
      <div class="card-head"><h3 class="card-title">${t("whatIf")}</h3><p class="card-desc">${t("whatIfDesc")}</p></div>
      <div class="stack">
        <div class="row wrap" role="radiogroup" aria-label="${t("scenario")}">${D.scenarios.map((s) => `<button type="button" class="choice" role="radio" aria-checked="${S.scenario === s.id}" data-action="scenario" data-id="${s.id}">${esc(tr(s.label))}</button>`).join("")}
          ${sc ? `<button class="btn btn-ghost" style="height:44px" data-action="scenario" data-id="">${ic("history")}${t("reset")}</button>` : ""}</div>
        ${result}
      </div>
    </div>
    <p class="note-line">${ic("info", "i-sm")}${esc(tr(D.planAssumption))}</p>
    <section class="plan-grid" aria-label="${t("planTitle")}">${plan.slice(0, lastIdx + 1).map((sem, i) => {
      const load = sem.reduce((s, c) => s + c.credits, 0), over = load > max;
      const under = sem.length > 0 && load < D.minLoad && i !== gradIdx;
      const extra = i > D.baselineGraduationIndex;
      return `<div class="card ${extra ? "ring-warn" : ""} ${sem.length ? "" : "empty-term"}">
        <div class="card-head stack-sm"><h3 class="card-title" style="justify-content:space-between">${esc(tr(D.semesterNames[i]))}${i === gradIdx ? `<span style="color:var(--primary)" aria-label="${t("estGraduation")}">${ic("grad")}</span>` : ""}</h3>
          <div class="row between xs"><span class="muted">${t("semesterLoad")}</span><span class="num" style="font-weight:500;${over ? "color:var(--destructive)" : under ? "color:var(--warning)" : ""}">${num(load)}/${num(max)}</span></div>${bar(load, max, over ? "bad" : under ? "warn" : "", "thin", t("semesterLoad"))}
          ${under ? `<p class="under">${ic("alert", "i-sm")}${t("underMinLoad")}</p>` : ""}</div>
        ${sem.length ? `<ul class="stack-sm">${sem.map((c) => {
          const from = baseIdx.has(c.code) ? baseIdx.get(c.code) : i, moved = !!sc && from !== i, later = i > from;
          const reqs = [...c.requires.map(code), ...(c.minCredits ? [`<span class="num">≥ ${num(c.minCredits)} ${t("creditsShort")}</span>`] : [])];
          return `<li class="plan-item stack-sm ${moved ? "moved" : ""}"><div class="row between" style="align-items:flex-start"><p style="font-weight:500;line-height:1.4">${esc(name(c.code))}</p>${moved ? `<span class="row xxs" style="gap:4px;flex-shrink:0;color:var(--warning);font-weight:500">${ic("move", "i-sm " + (later ? "flip-rtl" : "flip-ltr"))}${later ? t("delayed") : t("movedEarlier")}</span>` : ""}</div>
            <div class="row wrap xxs muted" style="gap:6px">${code(c.code)}<span>· ${num(c.credits)} ${t("creditsShort")}</span>${tag(c.category)}${c.slot ? slotTag(c.slot) : ""}</div>
            ${reqs.length ? `<p class="xxs muted">${t("requires")}: ${reqs.join(listSep())}</p>` : ""}</li>`;
        }).join("")}</ul>` : `<p class="xs muted">${t("noCoursesThisTerm")}</p>`}</div>`;
    }).join("")}</section>
    <div class="row wrap" style="margin-top:24px">${verified()}${source("catalog")}${source("load")}${source("training")}</div>
  </div>`;
}

const statusKey = { passed: "stPassed", failed: "stFailed", eligible: "stEligible", locked: "stLocked" };
const statusIcon = { passed: "check", failed: "x", eligible: "check", locked: "lock" };
function statusPill(st) {
  const missing = st.missing || [];
  return `<span><span class="st st-${st.kind}">${ic(statusIcon[st.kind], "i-sm")}${t(statusKey[st.kind])}</span>${missing.length ? `<span class="st-note">${t("short")}: ${missing.map(code).join(listSep())}</span>` : ""}${st.creditsShort ? `<span class="st-note num">${t("short")}: ${num(st.creditsShort)} ${t("creditsShort")}</span>` : ""}</span>`;
}
function termBadge(sem) {
  const fall = termOf(sem) === "fall";
  return `<span style="display:inline-flex;flex-direction:column;line-height:1.3"><span class="row" style="gap:4px;font-weight:500;white-space:nowrap"><span style="color:${fall ? "var(--highlight-ink)" : "var(--chart2)"}">${ic(fall ? "leaf" : "flower", "i-sm")}</span>${t("semesterLabel")} ${num(sem)}</span><span class="xxs muted">${fall ? t("fall") : t("spring")} · ${t("levelLabel")} ${num(levelOf(sem))}</span></span>`;
}
const codeLinks = (codes) => codes.length
  ? `<span class="row wrap" style="gap:4px">${codes.map((c) => { const ok = D.record.passed.includes(c); return `<button type="button" class="code-link ${ok ? "ok" : ""}" data-action="pick" data-code="${c}" title="${esc(name(c))}">${ok ? ic("check", "i-sm") : ""}${code(c)}</button>`; }).join("")}</span>`
  : `<span class="muted">${t("none")}</span>`;

function filteredCourses() {
  const f = S.f, q = f.q.trim().toLowerCase();
  const hit = (x) => x.code.toLowerCase().includes(q) || x.name.toLowerCase().includes(q);
  return P.courses.filter((c) => {
    if (q && !hit(c) && !(c.electiveGroup ? P.electivePools[c.electiveGroup].some(hit) : false)) return false;
    if (f.level !== "all" && levelOf(c.semester) !== +f.level) return false;
    if (f.semester !== "all" && c.semester !== +f.semester) return false;
    if (f.category !== "all" && c.category !== f.category) return false;
    if (f.type !== "all" && c.type !== f.type) return false;
    if (f.term !== "all" && termOf(c.semester) !== f.term) return false;
    if (f.status !== "all" && D.statuses[c.code].kind !== f.status) return false;
    return true;
  });
}
function courseRow(c) {
  const isSlot = c.type === "elective", open = S.openRow === c.code, st = D.statuses[c.code];
  const chosen = isSlot ? D.record.electiveChoices[c.code] : null;
  const label = isSlot ? c.code.replace("ELEC ", "") : c.code;
  const prereqCell = c.minCredits ? `<span class="num">≥ ${num(c.minCredits)} ${t("minEarned")}</span>`
    : isSlot ? `<span class="muted">${t("slotOptions")}</span>`
    : c.prereqs.length ? `<span class="row wrap" style="gap:4px">${c.prereqs.map((p) => `<span class="chip">${code(p)}</span>`).join("")}</span>` : `<span class="muted">${t("none")}</span>`;
  let panel = "";
  if (open) {
    const inner = isSlot
      ? `<div class="stack-sm"><p class="xs muted" style="font-weight:500">${t("slotOptions")} (${c.electiveGroup}, ${num(P.electivePools[c.electiveGroup].length)})</p><ul class="pool">${P.electivePools[c.electiveGroup].map((p) => `<li class="stack-sm ${chosen === p.code ? "pick" : ""}"><div class="row wrap between" style="align-items:flex-start"><div style="min-width:0"><p class="row wrap" style="font-weight:500">${esc(p.name)}${chosen === p.code ? `<span class="pick-badge">${ic("star", "i-sm")}${t("yourPick")}</span>` : ""}</p><p class="row wrap xs muted">${code(p.code)} · ${num(p.credits)} ${t("creditsShort")} ${tag(p.category)}</p></div>${statusPill(D.statuses[p.code])}</div><p class="desc" lang="en">${esc(p.description)}</p><div class="row wrap xs"><span class="muted">${t("prerequisites")}:</span>${codeLinks(p.prereqs)}</div></li>`).join("")}</ul></div>`
      : `<dl class="two"><div class="stack-sm"><dt class="xs muted" style="font-weight:500">${t("prerequisites")}</dt><dd>${c.minCredits ? `<span class="num">≥ ${num(c.minCredits)} ${t("minEarned")}</span>` : codeLinks(c.prereqs)}</dd></div><div class="stack-sm"><dt class="xs muted" style="font-weight:500">${t("requiredBy")}</dt><dd>${codeLinks(D.dependents[c.code])}</dd></div></dl>`;
    panel = `<div class="cpanel stack" id="row-${c.code.replace(" ", "-")}">${inner}</div>`;
  }
  return `<li class="crow ${isSlot ? "slot-row" : ""} ${open ? "open" : ""}">
    <button type="button" class="crow-btn" data-action="row" data-code="${c.code}" aria-expanded="${open}">
      <span class="md stack-sm">${code(label)}<span style="display:block;margin-top:4px">${tag(c.category)}</span></span>
      <span style="min-width:0">
        <span class="row wrap sm-only" style="gap:6px"><span class="xs muted">${code(label)}</span>${tag(c.category)}</span>
        <span style="display:block;font-weight:500">${esc(isSlot ? `${c.name} · ${c.electiveGroup}` : c.name)}</span>
        <span class="xs muted">${esc(tr(P.typeLabels[c.type]))}${chosen ? ` · ${t("yourPick")}: ${code(chosen)}` : ""}<span class="sm-only"> · ${num(c.credits)} ${t("creditsShort")} · ${t("semesterLabel")} ${num(c.semester)}</span></span>
      </span>
      <span class="md num" style="text-align:center;font-weight:600">${num(c.credits)}</span>
      <span class="md">${termBadge(c.semester)}</span>
      <span class="xl xs">${prereqCell}</span>
      <span class="status-cell">${statusPill(st)}</span>
      <span class="md">${ic("chevron", "chev")}</span>
    </button>${panel}</li>`;
}

function catalogCourses() {

  const stats = [
    [num(P.totalCredits), t("statTotalCredits")], [num(P.courses.length - slots), t("statCourses")], [num(slots), t("statElectiveSlots")], [num(F.semesters), t("statSemesters")],

  { path: "/chat", key: "navChat", short: "navChatShort", icon: "chat", view: viewChat },
  { path: "/recommendations", key: "navCourses", short: "navCoursesShort", icon: "sparkles", view: viewRecs },
  { path: "/plan", key: "navPlan", short: "navPlanShort", icon: "calendar", view: viewPlan },
  { path: "/catalog", key: "navCatalog", short: "navCatalogShort", icon: "library", view: viewCatalog },
];
const route = () => ROUTES.find((r) => r.path === (location.hash.slice(1) || "/")) || ROUTES[0];
const isDark = () => S.theme === "dark" || (S.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);

function renderShell() {
  const html = document.documentElement, r = route(), ar = S.lang === "ar";
  html.lang = S.lang; html.dir = ar ? "rtl" : "ltr";
  html.classList.toggle("dark", isDark());
  document.getElementById("skip").textContent = t("skipToContent");
  document.getElementById("banner").textContent = t("demoDataHint");
  const logo = document.getElementById("logo");
  logo.setAttribute("aria-label", t("appName"));
  logo.innerHTML = `${mark(32)}<span><span class="lockup-name" lang="${ar ? "ar" : "en"}">${ar ? "مساري" : "Masari"}</span><span class="lockup-sub" lang="${ar ? "en" : "ar"}">${ar ? "Masari" : "مساري"}</span></span>`;
  document.getElementById("topnav").setAttribute("aria-label", t("mainNav"));
  document.getElementById("topnav").innerHTML = ROUTES.map((x) => `<a href="#${x.path}" ${x === r ? 'aria-current="page"' : ""}>${ic(x.icon)}<span class="short">${t(x.short)}</span><span class="full">${t(x.key)}</span></a>`).join("");
  document.getElementById("bottomnav").setAttribute("aria-label", t("mainNav"));
  document.getElementById("bottomnav").innerHTML = `<ul>${ROUTES.map((x) => `<li><a href="#${x.path}" ${x === r ? 'aria-current="page"' : ""}>${ic(x.icon)}<span>${t(x.short)}</span></a></li>`).join("")}</ul>`;
  document.getElementById("studentChip").innerHTML = `<span class="sq">${esc(tr(D.student.fullName).charAt(0))}</span><span style="line-height:1.3"><span style="display:block;font-size:14px;font-weight:500">${esc(tr(D.student.fullName))}</span><span class="xs muted num" style="display:block">${esc(tr(D.student.level))}${ar ? "، " : ", "}GPA ${gpa()}</span></span>`;
  document.getElementById("demoBadge").innerHTML = demo();
  const lb = document.getElementById("langBtn");
  lb.innerHTML = ic("languages") + `<span class="hide-sm">${t("switchLang")}</span><span class="sm-only">${ar ? "EN" : "ع"}</span>`;
  lb.lang = ar ? "en" : "ar"; lb.setAttribute("aria-label", t("switchLangLabel"));
  const tb = document.getElementById("themeBtn");
  tb.innerHTML = ic(isDark() ? "sun" : "moon"); tb.setAttribute("aria-label", t("toggleTheme"));
}

function render() {
  renderShell();
  document.getElementById("main").innerHTML = route().view();
  if (route().path === "/chat") bindChat();
  if (route().path === "/") centerRail();
}
function scrollChat() { const log = document.getElementById("chatLog"); if (log) log.scrollTop = log.scrollHeight; }
function bindChat() {
  const input = document.getElementById("chatInput"), btn = document.getElementById("sendBtn");
  input.addEventListener("input", () => { btn.disabled = !input.value.trim() || S.thinking; input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
  document.getElementById("composer").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
}
function send(text) {
  const v = text.trim(); if (!v || S.thinking) return;
  S.messages.push({ role: "user", text: v }); S.thinking = true;
  render(); scrollChat(); document.getElementById("chatInput").focus();
  // UI-only: the real reply will stream from the backend (RAG + rules engine + recommender).
  setTimeout(() => { S.messages.push({ role: "assistant", kind: "demo" }); S.thinking = false; if (route().path === "/chat") { render(); scrollChat(); } }, 900);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if (a === "lang") { S.lang = S.lang === "ar" ? "en" : "ar"; store.set("masari.lang", S.lang); render(); }
  else if (a === "theme") { S.theme = isDark() ? "light" : "dark"; store.set("masari.theme", S.theme); renderShell(); }
  else if (a === "open-drawer") document.body.classList.add("drawer-open");
  else if (a === "close-drawer") document.body.classList.remove("drawer-open");
  else if (a === "toggle-course") { const c = el.dataset.code; S.selected = S.selected.includes(c) ? S.selected.filter((x) => x !== c) : [...S.selected, c]; render(); }
  else if (a === "tab") { S.tab = el.dataset.tab; render(); }
  else if (a === "cat-tab") { S.catTab = el.dataset.tab; render(); }
  else if (a === "ins-course") { S.insCourse = el.dataset.code; render(); }
  else if (a === "scenario") { S.scenario = el.dataset.id || null; render(); }
  else if (a === "mic") { S.listening = !S.listening; render(); }
  else if (a === "suggest") send(tr(D.chatSuggestions[+el.dataset.i]));
  else if (a === "new-chat") { S.messages = []; render(); }
  else if (a === "row") { S.openRow = S.openRow === el.dataset.code ? null : el.dataset.code; refreshCatalogList(); }
  else if (a === "pick") { S.f = { ...emptyFilters, q: el.dataset.code }; S.openRow = el.dataset.code; render(); window.scrollTo(0, 0); }
  else if (a === "reset-filters") { S.f = { ...emptyFilters }; S.openRow = null; render(); }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.pref) {
    // Sliders update only the instructor list so dragging stays smooth.
    const k = el.dataset.pref; S.prefs[k] = +el.value;
    document.getElementById("pv-" + k).textContent = num(S.prefs[k]);
    document.getElementById("insList").innerHTML = instructorCards();
  } else if (el.dataset && el.dataset.filter === "q") { S.f.q = el.value; refreshCatalogList(); }
});
document.addEventListener("change", (e) => {
  const k = e.target.dataset && e.target.dataset.filter; if (!k || k === "q") return;
  S.f[k] = e.target.value; if (k === "level") S.f.semester = "all";
  if (k === "level") render(); else refreshCatalogList();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.body.classList.remove("drawer-open"); });
window.addEventListener("hashchange", () => { document.body.classList.remove("drawer-open"); render(); window.scrollTo(0, 0); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderShell);
render();

</script>
</body>
</html>
